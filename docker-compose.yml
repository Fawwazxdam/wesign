services:
  # Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wesign-backend
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - wesign-network

  # Frontend (Vue + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wesign-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - wesign-network

  # Database (MySQL)
  mysql_db:
    image: mysql:8.0
    container_name: wesign-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wesign
      MYSQL_ROOT_PASSWORD: 
    volumes:
      - ./docker/db_data:/var/lib/mysql
    networks:
      - wesign-network

networks:
  wesign-network:
    driver: bridge